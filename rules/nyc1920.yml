# Rule set: NYC 1920 building
# Loaded by promobu/rules_loader.rb  →  RulesLoader.load("rules/nyc1920.yml")
# Notes on tiled sx values computed from original Ruby expressions:
#   18*0.1/12  = 0.15
#   13/55      = 0.23636363636363636
#   47*0.1/9   ≈ 0.5222222222222222
#   83*0.1/29  ≈ 0.2862068965517241

rules:
  - name: delete
    actions:
      - instantiate: [Empty, ~]

  - name: root
    actions:
      - split_y:
          - { abs: 2.5, rule: groundLevel0 }
          - { abs: 0.3, rule: groundLevelFrise0 }
          - { abs: 0.9, rule: frise0 }
          - { abs: 0.1, rule: frise0frise0 }
          - { rel: 1,   rule: MainLevels }
          - { abs: 1.3, rule: LastMainLevel }
          - { abs: 0.1, rule: topFrise0frise00 }
          - { abs: 1.1, rule: topFrise0 }
          - { abs: 0.3, rule: roof0 }
          - { abs: 1.2, rule: balcon0 }

  # ── Ground Level ────────────────────────────────────────────────────────────

  - name: groundLevel0
    actions:
      - component: { faces: side, rules: [groundLevel0face] }

  - name: groundLevel0face
    condition: front_face
    actions:
      - split_x:
          - { abs: 2.5, rule: groundLevel0Door2 }
          - { rel: 1, rule: groundLevel0faceInner }
          - { abs: 2.5, rule: groundLevel0Door2 }

  - name: groundLevel0faceInner
    actions:
      - scope:       { z: -0.4 }
      - translation: { x: 0, y: 0, z: 0.4 }
      - instantiate:
        - Box
        - actions:
            - component: { faces: front, rules: [groundLevel0faceInner0Front] }
            - component: { faces: right, rules: [groundLevel0Door2DoorColumn2] }
            - component: { faces: left,  rules: [groundLevel0Door2DoorColumn2] }

  - name: groundLevel0faceInner0Front
    actions:
      - split_x:
          - repeat:
              size: 2
              elements:
                - { abs: 1.8, rule: groundLevel0Door2Door, condition: not_first }
                - { rel: 1,   rule: groundLevel0Door2DoorColumn }

  - name: groundLevel0face
    actions:
      - split_x:
          - repeat:
              size: 2
              elements:
                - { abs: 1.8, rule: groundLevel0Door2Door, condition: not_first }
                - { rel: 1, rule: groundLevel0Door2DoorColumn }

  # Ground Level Door
  - name: groundLevel0Door2
    actions:
      - split_x:
          - { abs: 0.5, rule: groundLevel0Door2DoorColumn }
          - { rel: 1,   rule: groundLevel0Door2Door }
          - { abs: 0.5, rule: groundLevel0Door2DoorColumn }

  # Ground Level Column
  - name: groundLevel0Door2DoorColumn
    actions:
      - scope:       { z: 0.2 }
      - translation: { x: 0, y: 0, z: -0.2 }
      - instantiate:
          - Box
          - actions:
              - component: { faces: front, rules: [groundLevel0Door2DoorColumn2] }
              - component: { faces: right, rules: [groundLevel0Door2DoorColumn2] }
              - component: { faces: left,  rules: [groundLevel0Door2DoorColumn2] }

  - name: groundLevelFrise0
    actions:
      - scope:       { dx: 0.4, dz: 0.4 }
      - translation: { x: -0.2, y: 0, z: -0.2 }
      - component:   { faces: all, rules: [groundLevelFriseFace] }

  # ── Main Levels ─────────────────────────────────────────────────────────────

  - name: MainLevels
    actions:
      - split_y:
          - repeat: { size: 1, rule: MainLevel0 }

  - name: MainLevel0
    actions:
      - component: { faces: side, rules: [MainLevelFace0] }

  - name: MainLevelFace0
    condition: front_face
    actions:
      - split_x:
          - { abs: 2.5, rule: MainLevel0Border }
          - { rel: 1,   rule: MainLevel0FaceInner }
          - { abs: 2.5, rule: MainLevel0Border }

  - name: MainLevel0FaceInner
    actions:
      - scope:       { z: -0.4 }
      - translation: { x: 0, y: 0, z: 0.4 }
      - instantiate:
          - Box
          - actions:
              - component: { faces: front, rules: [MainLevel0FaceInner0Front] }
              - component: { faces: right, rules: [groundLevel0Door2DoorColumn2] }
              - component: { faces: left,  rules: [groundLevel0Door2DoorColumn2] }

  - name: MainLevel0FaceInner0Front
    actions:
      - split_x:
          - repeat:
              size: 2
              elements:
                - { abs: 1.8, rule: MainLevel0CenterWindows2 }
                - { rel: 1,   rule: MainLevel0CenterColumn, condition: not_last }

  - name: MainLevel0Border
    actions:
      - split_x:
          - { abs: 0.5, rule: MainLevel0BorderWall }
          - { rel: 1,   rule: MainLevel0BorderWindows2 }
          - { abs: 0.5, rule: MainLevel0BorderWall }

  - name: MainLevelFace0
    actions:
      - split_x:
          - repeat:
              size: 2.5
              elements:
                - { rel: 1,   rule: MainLevel0BorderWindows2, condition: not_first }
                - { abs: 0.5, rule: MainLevel0BorderWall }

  # ── Last Main Level ─────────────────────────────────────────────────────────

  - name: LastMainLevel
    actions:
      - component: { faces: side, rules: [LastMainLevelFace0] }

  - name: LastMainLevelFace0
    condition: front_face
    actions:
      - split_x:
          - { abs: 2.5, rule: LastMainLevel0Border }
          - { rel: 1,   rule: LastMainLevel0FaceInner }
          - { abs: 2.5, rule: LastMainLevel0Border }

  - name: LastMainLevel0FaceInner
    actions:
      - scope:       { z: -0.4 }
      - translation: { x: 0, y: 0, z: 0.4 }
      - instantiate:
          - Box
          - actions:
              - component: { faces: front, rules: [LastMainLevel0FaceInner0Front] }
              - component: { faces: right, rules: [groundLevel0Door2DoorColumn2] }
              - component: { faces: left,  rules: [groundLevel0Door2DoorColumn2] }

  - name: LastMainLevel0FaceInner0Front
    actions:
      - split_x:
          - repeat:
              size: 2
              elements:
                - { abs: 1.8, rule: LastMainLevel0CenterWindows2 }
                - { rel: 1,   rule: LastMainLevel0CenterColumn, condition: not_last }

  - name: LastMainLevel0Border
    actions:
      - split_x:
          - { abs: 0.5, rule: LastMainLevel0BorderWall }
          - { rel: 1,   rule: LastMainLevel0BorderWindows2 }
          - { abs: 0.5, rule: LastMainLevel0BorderWall }

  - name: LastMainLevelFace0
    actions:
      - split_x:
          - repeat:
              size: 2.5
              elements:
                - { rel: 1,   rule: LastMainLevel0BorderWindows2 , condition: not_first }
                - { abs: 0.5, rule: LastMainLevel0BorderWall }

  # ── Frise ───────────────────────────────────────────────────────────────────

  - name: frise0
    actions:
      - component: { faces: side, rules: [frise0face] }

  - name: frise0face
    actions:
      - split_y:
          - { rel: 1,   rule: frise0windows }
          - { abs: 0.1, rule: frise0wall }

  - name: frise0windows
    condition: front_face
    actions:
      - split_x:
          - { abs: 2.5, rule: frise0windwosBorder }
          - { rel: 1,   rule: frise0windowsInner }
          - { abs: 2.5, rule: frise0windwosBorder }

  - name: frise0windowsInner
    actions:
      - scope:       { z: -0.4 }
      - translation: { x: 0, y: 0, z: 0.4 }
      - instantiate:
          - Box
          - actions:
              - component: { faces: front, rules: [frise0windowsInner0Front] }
              - component: { faces: right, rules: [groundLevel0Door2DoorColumn2] }
              - component: { faces: left,  rules: [groundLevel0Door2DoorColumn2] }

  - name: frise0windowsInner0Front
    actions:
      - split_x:
          - repeat:
              size: 2
              elements:
                - { abs: 1.8, rule: frise0windwosWindows2, condition: not_first }
                - { rel: 1,   rule: frise0windwosBlason }

  - name: frise0windwosBorder
    actions:
      - split_x:
          - { abs: 0.5, rule: frise0windwosBorderSatus }
          - { rel: 1,   rule: frise0windwosWindows2 }
          - { abs: 0.5, rule: frise0windwosBorderSatus }

  - name: frise0windows
    actions:
      - split_x:
          - repeat:
              size: 2
              elements:
                - { abs: 1.8, rule: frise0windwosWindows2, condition: not_first }
                - { rel: 1, rule: frise0windwosBlason }

  # ── Top Frise ────────────────────────────────────────────────────────────────

  - name: topFrise0
    actions:
      - component: { faces: side, rules: [topFrise0face] }

  - name: topFrise0face
    actions:
      - split_y:
          - { rel: 1,   rule: topFrise0windows0 }
          - { abs: 0.3, rule: topFrise0frise1 }

  - name: topFrise0windows0
    actions:
      - split_x:
          - repeat:
              size: 1
              elements:
                - { rel: 1,   rule: topFrise0windows0window, condition: not_first }
                - { abs: 0.4, rule: topFrise0windows0box }

  # ── Balcon ───────────────────────────────────────────────────────────────────

  - name: balcon0
    actions:
      - component: { faces: side, rules: [balcon0face] }

  - name: balcon0face
    actions:
      - split_x:
          - { abs: 0.3, rule: balcon0corner }
          - repeat:
              size: 1.3
              elements:
                - { rel: 1, rule: balcon0column, condition: not_first }
                - { abs: 1, rule: balcon0join }
          - { abs: 0.3, rule: balcon0corner }

  # ── Frise borders (scope-extruded boxes) ────────────────────────────────────

  - name: frise0frise0
    actions:
      - scope:       { dx: 0.4, dz: 0.4 }
      - translation: { x: -0.2, y: 0, z: -0.2 }
      - component:   { faces: all, rules: [frise0friseFace] }

  - name: topFrise0frise00
    actions:
      - scope:       { dx: 0.4, dz: 0.4 }
      - translation: { x: -0.2, y: 0, z: -0.2 }
      - component:   { faces: all, rules: [topFrise0frise01Face] }

  - name: roof0
    actions:
      - scope:       { dx: 0.8, dz: 0.8 }
      - translation: { x: -0.4, y: 0, z: -0.4 }
      - component:   { faces: all, rules: [roof0Face] }

  # Duplicate in original source — preserved as-is
  - name: balcon0
    actions:
      - component: { faces: side, rules: [balcon0face] }

  # ── Textures ─────────────────────────────────────────────────────────────────
  # Use atlas + sprite JSON generated by promobu/dir_sprite_pack.rb
  # Atlas image: nyc1920-sprites.webp
  # Sprite map:  nyc1920-sprites.json

  - name: groundLevel0Door2DoorColumn2
    actions:
      - texture: ground-column

  - name: groundLevel0Door2Door
    actions:
      - texture: ground-door

  - name: groundLevelFriseFace
    actions:
      - texture: ground-frise

  - name: MainLevel0CenterColumn
    actions:
      - texture: main-wall

  - name: MainLevel0BorderWall
    actions:
      - texture: main-wall

  - name: MainLevel0BorderWindows2
    actions:
      - texture: main-windows2

  - name: MainLevel0CenterWindows2
    actions:
      - texture: main-windows2c

  - name: LastMainLevel0CenterColumn
    actions:
      - texture: main-wall

  - name: LastMainLevel0BorderWall
    actions:
      - texture: main-wall

  - name: LastMainLevel0BorderWindows2
    actions:
      - texture: main-last-windows2

  - name: LastMainLevel0CenterWindows2
    actions:
      - texture: main-last-windows2c

  - name: frise0friseFace
    actions:
      - texture: frise-frise

  - name: frise0windwosWindows2
    actions:
      - texture: frise-windows2

  - name: frise0windwosBorderSatus
    actions:
      - texture: frise-status

  - name: frise0windwosBlason
    actions:
      - texture: frise-blason

  - name: frise0wall
    actions:
      - texture: wall

  - name: topFrise0frise01Face
    actions:
      - texture: top-frise-frise0

  - name: topFrise0frise1
    actions:
      - texture: top-frise-frise1

  - name: topFrise0windows0box
    actions:
      - texture: top-frise-box

  - name: topFrise0windows0window
    actions:
      - texture: top-frise-window

  - name: roof0Face
    actions:
      - texture: roof-frise

  - name: balcon0corner
    actions:
      - texture: { sprite: balcon-corner, double_side: true }

  - name: balcon0join
    actions:
      - texture: { sprite: balcon-join, double_side: true }

  - name: balcon0column
    actions:
      - texture: { sprite: balcon-column, double_side: true }
