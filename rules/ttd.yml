# Rule set: TTD building
# Loaded by promobu/rules_loader.rb  →  RulesLoader.load("rules/ttd.yml")

textures:
  corner:   { type: tiled, file: ttd/corner.png,   sx: 1, sy: 1 }
  ornement: { type: tiled, file: ttd/ornement.png,  sx: 1, sy: 1 }
  roof:     { type: tiled, file: ttd/roof.png,      sx: 2, sy: 2 }

rules:
  - name: delete
    actions:
      - instantiate: [Empty, ~]

  - name: root
    actions:
      - split_y:
          - { abs: 1.2, rule: groundLevel0 }
          - { abs: 1,   rule: groundLevelOrnement }
          - { rel: 3,   rule: MainLevels }
          - { rel: 5,   rule: UpperLevels0 }

  - name: groundLevelOrnement
    actions:
      - component: { faces: side, rules: [Ornement] }

  - name: groundLevel0
    actions:
      - component: { faces: right, rules: [ColumnLine0] }
      - component: { faces: left,  rules: [ColumnLine0] }
      - split_x:
          - { abs: 1, rule: delete }
          - { rel: 1, rule: groundLevel1 }
          - { abs: 1, rule: delete }

  - name: groundLevel1
    actions:
      - split_z:
          - { rel: 1, rule: groundLevel2 }
          - { abs: 1, rule: delete }

  - name: groundLevel2
    actions:
      - component: { faces: side, rules: [Level] }

  # Repeat a (Column0 + gap) tile, capped by a final Column0
  - name: ColumnLine0
    actions:
      - split_x:
          - repeat:
              size: 1
              elements:
                - { abs: 0.4, rule: Column0 }
                - { rel: 1,   rule: delete }
          - { abs: 0.4, rule: Column0 }

  # Fix scope to column dimensions before instantiating
  - name: Column0
    actions:
      - scope: { x: 0.4, z: 0.3 }
      - instantiate:
          - Box
          - actions:
              - component: { faces: side, rules: [Column2] }

  - name: UpperLevels0
    actions:
      - split_x:
          - { rel: 1, rule: UpperLevels2 }
          - { rel: 1, rule: UpperLevels2 }

  - name: UpperLevels2
    actions:
      - split_z:
          - { rel: 1, rule: UpperLevels3 }
          - { rel: 1, rule: UpperLevels3 }

  # Randomly shrink height before re-using MainLevels grammar
  - name: UpperLevels3
    actions:
      - scope: { dy: neg_rand_half_y }
      - component: { faces: side, rules: [MainLevelsFaces] }
      - component: { faces: top,  rules: [Roof] }

  - name: MainLevelsFaces
    actions:
      - split_y:
          - { rel: 1,   rule: MainLevelsWindows }
          - { abs: 0.5, rule: Ornement }

  - name: MainLevelsWindows
    actions:
      - split_y:
          - repeat: { size: 1, rule: Level }

  - name: Level
    actions:
      - split_x:
          - { abs: 1, rule: LevelCorner }
          - repeat: { size: 0.5, rule: Window }
          - { abs: 1, rule: LevelCorner }

  - name: Column2
    actions:
      - texture: ornement

  - name: Window
    actions:
      - texture: { type: adapted, file: ttd/window.png }

  - name: LevelCorner
    actions:
      - texture: corner

  - name: Ornement
    actions:
      - texture: ornement

  - name: Roof
    actions:
      - texture: roof
